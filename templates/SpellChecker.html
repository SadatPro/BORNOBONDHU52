<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BornoBondhu52 - Intelligent Bangla Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bangla-font { font-family: 'Noto Serif Bengali', serif; }
        
        /* Fluent Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Error Underline Animation */
        .error-highlight {
            text-decoration: underline wavy #ef4444;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
            cursor: pointer;
            background-color: rgba(254, 226, 226, 0.4);
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .error-highlight:hover {
            background-color: rgba(254, 226, 226, 0.8);
            text-decoration-color: #dc2626;
        }

        /* Tooltip Animation */
        .tooltip-container {
            position: absolute;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 0.75rem;
            padding: 0.5rem;
            z-index: 50;
            min-width: 180px;
            display: none;
            animation: fadeIn 0.2s ease-out;
            transform-origin: top left;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Glassmorphism Header */
        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Modal Styles */
        .modal {
            transition: opacity 0.25s ease;
        }
        body.modal-active {
            overflow-x: hidden;
            overflow-y: visible !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <!-- Navbar -->
    <header class="glass-header py-4 px-6 md:px-12 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-teal-500 to-emerald-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-teal-500/30">
                <span class="mt-[-4px]">ব</span>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600">BornoBondhu52</h1>
                <p class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Advanced AI Spell Checker</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- Dictionary Manager Button -->
            <button onclick="toggleModal('dictionary-modal')" class="text-slate-500 hover:text-teal-600 font-medium text-sm flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                Dictionary Manager
            </button>

            <!-- Status Indicator -->
             <div class="flex items-center gap-2">
                <span id="typing-status" class="hidden flex items-center gap-2 text-xs font-semibold text-teal-600 bg-teal-50 px-3 py-1 rounded-full border border-teal-100">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-teal-500"></span>
                    </span>
                    Analyzing...
                </span>
            </div>

            <!-- Fix All Button -->
            <button id="fix-all-btn" onclick="applyAutoCorrect()" class="hidden group relative inline-flex items-center justify-center px-5 py-2 text-sm font-medium text-white transition-all duration-200 bg-gradient-to-r from-teal-600 to-emerald-600 rounded-full hover:from-teal-700 hover:to-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 shadow-md shadow-teal-500/20">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Auto Fix All
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden max-w-7xl mx-auto w-full p-4 md:p-8 gap-6">
        
        <!-- Editor Container -->
        <div class="flex-1 bg-white rounded-2xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col overflow-hidden relative group transition-shadow hover:shadow-[0_8px_30px_-4px_rgba(0,0,0,0.08)]">
            
            <!-- Toolbar -->
            <div class="px-6 py-3 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Editor</span>
                <div class="flex gap-2">
                    <button onclick="copyText()" class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition" title="Copy Text">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                    <button onclick="resetEditor()" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition" title="Clear All">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            </div>

            <div class="relative flex-1">
                <!-- Raw Input -->
                <textarea id="input-text" 
                    class="bangla-font w-full h-full p-8 text-lg md:text-xl text-slate-700 focus:outline-none resize-none bg-transparent leading-relaxed placeholder:text-slate-300"
                    placeholder="এখানে লেখা শুরু করুন... (Start typing here)"></textarea>

                <!-- Processed Output (Overlay) -->
                <div id="output-area" 
                    class="bangla-font w-full h-full p-8 text-lg md:text-xl text-slate-700 absolute top-0 left-0 bg-white/95 overflow-auto hidden leading-relaxed"
                    contenteditable="false">
                </div>
            </div>

            <!-- Footer Stats -->
            <div class="px-6 py-2 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                <span id="word-count">0 words</span>
                <span id="status-msg">Ready</span>
            </div>
        </div>

    </main>

    <!-- Suggestion Tooltip -->
    <div id="suggestion-tooltip" class="tooltip-container">
        <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-100">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Suggestions</span>
            <button onclick="hideTooltip()" class="text-slate-300 hover:text-slate-500">&times;</button>
        </div>
        <div id="suggestion-list" class="flex flex-col space-y-1">
            <!-- Dynamic Content -->
        </div>
    </div>

    <!-- Dictionary Manager Modal -->
    <div id="dictionary-modal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-50"></div>
        
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-2xl shadow-2xl z-50 overflow-y-auto transform transition-all scale-95">
            <!-- Header -->
            <div class="modal-content py-6 text-left px-6">
                <div class="flex justify-between items-center pb-3">
                    <p class="text-xl font-bold text-slate-800">Dictionary Manager</p>
                    <div class="modal-close cursor-pointer z-50" onclick="toggleModal('dictionary-modal')">
                        <svg class="fill-current text-slate-500 hover:text-slate-700" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
                            <path d="M14.53 4.53l-1.06-1.06L9 7.94 4.53 3.47 3.47 4.53 7.94 9l-4.47 4.47 1.06 1.06L9 10.06l4.47 4.47 1.06-1.06L10.06 9z"></path>
                        </svg>
                    </div>
                </div>

                <!-- Body -->
                <div class="my-4">
                    <p class="text-sm text-slate-500 mb-2">Check if a word exists in the dictionary or add a new one.</p>
                    <input type="text" id="dict-search-input" class="bangla-font w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500" placeholder="Type a word (e.g. হ্যালো)">
                    
                    <div id="dict-result" class="mt-4 hidden p-4 rounded-lg bg-slate-50 border border-slate-100">
                        <div class="flex items-center gap-3">
                            <div id="dict-icon" class="w-8 h-8 rounded-full flex items-center justify-center bg-gray-200">
                                <!-- Icon injected via JS -->
                            </div>
                            <div>
                                <p id="dict-status-text" class="font-bold text-slate-800 text-sm">Searching...</p>
                                <p id="dict-word-display" class="bangla-font text-slate-500 text-xs"></p>
                            </div>
                        </div>
                        <button id="modal-add-btn" class="hidden mt-3 w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 px-4 rounded-lg transition text-sm">
                            Add to Dictionary
                        </button>
                    </div>
                </div>

                <!-- Footer -->
                <div class="flex justify-end pt-2">
                    <button onclick="toggleModal('dictionary-modal')" class="px-4 py-2 bg-transparent p-3 rounded-lg text-teal-600 hover:bg-slate-100 hover:text-teal-800 mr-2 text-sm font-medium">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('input-text');
        const outputArea = document.getElementById('output-area');
        const tooltip = document.getElementById('suggestion-tooltip');
        const suggestionList = document.getElementById('suggestion-list');
        const statusMsg = document.getElementById('status-msg');
        const typingStatus = document.getElementById('typing-status');
        const fixAllBtn = document.getElementById('fix-all-btn');
        const wordCount = document.getElementById('word-count');

        let isEditMode = true;
        let latestCorrectedText = "";
        let typingTimer;
        const DONE_TYPING_INTERVAL = 1200; // 1.2s delay

        // --- Dictionary Manager Logic ---
        const dictInput = document.getElementById('dict-search-input');
        const dictResult = document.getElementById('dict-result');
        const dictStatusText = document.getElementById('dict-status-text');
        const dictWordDisplay = document.getElementById('dict-word-display');
        const dictIcon = document.getElementById('dict-icon');
        const modalAddBtn = document.getElementById('modal-add-btn');
        let searchTimeout;

        function toggleModal(modalID){
            const modal = document.getElementById(modalID);
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
            
            if (!modal.classList.contains('opacity-0')) {
                // Reset when opening
                dictInput.value = '';
                dictResult.classList.add('hidden');
                dictInput.focus();
            }
        }

        dictInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const word = dictInput.value.trim();
            
            if (word.length === 0) {
                dictResult.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(() => searchDictionary(word), 500);
        });

        async function searchDictionary(word) {
            dictResult.classList.remove('hidden');
            dictStatusText.textContent = "Checking...";
            dictWordDisplay.textContent = word;
            dictIcon.className = "w-8 h-8 rounded-full flex items-center justify-center bg-slate-200 animate-pulse";
            modalAddBtn.classList.add('hidden');

            try {
                const response = await fetch('/api/search_word', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word })
                });
                const data = await response.json();

                if (data.exists) {
                    dictStatusText.textContent = "Word Found in Dictionary";
                    dictStatusText.className = "font-bold text-green-700 text-sm";
                    dictIcon.className = "w-8 h-8 rounded-full flex items-center justify-center bg-green-100 text-green-600";
                    dictIcon.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                } else {
                    dictStatusText.textContent = "Word Not Found";
                    dictStatusText.className = "font-bold text-amber-700 text-sm";
                    dictIcon.className = "w-8 h-8 rounded-full flex items-center justify-center bg-amber-100 text-amber-600";
                    dictIcon.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                    
                    modalAddBtn.classList.remove('hidden');
                    modalAddBtn.onclick = () => manualAddWord(word);
                }

            } catch (err) {
                console.error(err);
                dictStatusText.textContent = "Error checking dictionary";
            }
        }

        async function manualAddWord(word) {
            const originalText = modalAddBtn.textContent;
            modalAddBtn.textContent = "Adding...";
            modalAddBtn.disabled = true;

            try {
                const response = await fetch('/api/add_word', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word })
                });

                if (response.ok) {
                    modalAddBtn.textContent = "Added Successfully!";
                    modalAddBtn.classList.replace('bg-teal-600', 'bg-green-600');
                    modalAddBtn.classList.replace('hover:bg-teal-700', 'hover:bg-green-700');
                    setTimeout(() => {
                        searchDictionary(word); // Re-check to show "Found" state
                    }, 1000);
                } else {
                    alert("Failed to add word.");
                    modalAddBtn.textContent = originalText;
                    modalAddBtn.disabled = false;
                }
            } catch (err) {
                alert("Connection error.");
                modalAddBtn.textContent = originalText;
                modalAddBtn.disabled = false;
            }
        }

        // --- Core Event Listeners ---
        
        inputText.addEventListener('input', () => {
            clearTimeout(typingTimer);
            updateWordCount();
            statusMsg.textContent = "Typing...";
            typingStatus.classList.add('hidden');
            
            if (inputText.value.trim().length > 0) {
                typingTimer = setTimeout(checkGrammar, DONE_TYPING_INTERVAL);
            } else {
                statusMsg.textContent = "Ready";
                fixAllBtn.classList.add('hidden');
            }
        });

        function updateWordCount() {
            const words = inputText.value.trim().split(/\s+/).filter(w => w.length > 0).length;
            wordCount.textContent = `${words} word${words !== 1 ? 's' : ''}`;
        }

        async function checkGrammar() {
            const text = inputText.value;
            if (!text.trim()) return;

            statusMsg.textContent = "Scanning...";
            typingStatus.classList.remove('hidden'); 
            
            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                latestCorrectedText = data.corrected_text;
                
                // Toggle Fix All Button
                if (latestCorrectedText.trim() !== text.trim()) {
                    fixAllBtn.classList.remove('hidden');
                    fixAllBtn.classList.add('flex');
                } else {
                    fixAllBtn.classList.add('hidden');
                }

                renderResults(data.tokens);
                statusMsg.textContent = "Check Complete";
                typingStatus.classList.add('hidden');

            } catch (err) {
                console.error(err);
                statusMsg.textContent = "Connection Error";
                typingStatus.classList.add('hidden');
            }
        }

        function renderResults(tokens) {
            inputText.classList.add('hidden');
            outputArea.classList.remove('hidden');
            outputArea.innerHTML = '';
            isEditMode = false;

            tokens.forEach(token => {
                if (token.type === 'error') {
                    const span = document.createElement('span');
                    span.textContent = token.word;
                    span.className = 'error-highlight relative';
                    span.dataset.suggestions = JSON.stringify(token.suggestions);
                    
                    // Stop propagation to prevent immediate closing
                    span.onclick = (e) => showTooltip(e, span);
                    outputArea.appendChild(span);
                } else {
                    outputArea.appendChild(document.createTextNode(token.word));
                }
            });
            
            // Allow return to edit mode by clicking empty space
            outputArea.onclick = (e) => {
                if (e.target === outputArea) switchToEditMode();
            };
        }

        function showTooltip(e, element) {
            e.stopPropagation();
            
            // Positioning Logic
            const rect = element.getBoundingClientRect();
            tooltip.style.left = `${rect.left}px`;
            tooltip.style.top = `${rect.bottom + 10}px`; // slightly lower
            tooltip.style.display = 'block';

            const suggestions = JSON.parse(element.dataset.suggestions);
            suggestionList.innerHTML = '';
            
            // 1. Suggestions List
            if (suggestions.length > 0) {
                suggestions.forEach((sugg, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left px-3 py-2 text-sm rounded-md transition-colors flex items-center justify-between group ${
                        idx === 0 
                        ? 'bg-teal-50 text-teal-800 font-bold hover:bg-teal-100' 
                        : 'text-slate-600 hover:bg-slate-50 font-medium'
                    }`;
                    
                    const textSpan = document.createElement('span');
                    textSpan.className = 'bangla-font';
                    textSpan.textContent = sugg;
                    btn.appendChild(textSpan);

                    btn.onclick = () => applyCorrection(element, sugg);
                    suggestionList.appendChild(btn);
                });
            } else {
                const noSugg = document.createElement('div');
                noSugg.className = 'px-3 py-2 text-xs text-slate-400 italic';
                noSugg.textContent = 'No suggestions found';
                suggestionList.appendChild(noSugg);
            }

            // 2. Add to Dictionary Button
            const addBtn = document.createElement('button');
            addBtn.className = 'w-full text-left px-3 py-2 text-xs text-teal-600 hover:text-teal-700 hover:bg-teal-50 rounded-md mt-1 border-t border-slate-100 font-medium flex items-center gap-2';
            addBtn.innerHTML = `
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add to Dictionary
            `;
            addBtn.onclick = () => addToDictionary(element, element.textContent);
            suggestionList.appendChild(addBtn);
            
            // 3. Ignore Option
            const ignoreBtn = document.createElement('button');
            ignoreBtn.className = 'w-full text-left px-3 py-2 text-xs text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-md';
            ignoreBtn.textContent = 'Ignore once';
            ignoreBtn.onclick = () => {
                element.classList.remove('error-highlight');
                element.onclick = null;
                hideTooltip();
            };
            suggestionList.appendChild(ignoreBtn);

            // 4. Edit Manually Option
            const editBtn = document.createElement('button');
            editBtn.className = 'w-full text-left px-3 py-2 text-xs text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-md';
            editBtn.textContent = 'Edit Manually';
            editBtn.onclick = () => {
                switchToEditMode();
                hideTooltip();
                inputText.focus();
            };
            suggestionList.appendChild(editBtn);
        }

        async function addToDictionary(element, word) {
            try {
                // Optimistic UI Update
                const originalText = element.textContent;
                element.textContent = "Adding...";
                
                const response = await fetch('/api/add_word', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ word: word })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    element.textContent = originalText;
                    element.classList.remove('error-highlight');
                    element.onclick = null;
                    
                    // Success Flash
                    element.classList.add('text-teal-600', 'font-bold');
                    setTimeout(() => element.classList.remove('text-teal-600', 'font-bold'), 1500);
                    
                    hideTooltip();
                    statusMsg.textContent = `Added "${word}" to dictionary`;
                } else {
                    element.textContent = originalText;
                    alert("Failed to add word: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("Connection error");
            }
        }

        function applyCorrection(element, newWord) {
            element.textContent = newWord;
            element.classList.remove('error-highlight');
            element.classList.add('text-teal-600', 'font-medium'); // Success state
            
            // Remove success state after animation
            setTimeout(() => {
                element.classList.remove('text-teal-600', 'font-medium');
            }, 1500);
            
            element.onclick = null;
            hideTooltip();
            updateTextareaFromOutput();
        }
        
        function applyAutoCorrect() {
            if (latestCorrectedText) {
                // Flash effect
                outputArea.style.opacity = '0';
                setTimeout(() => {
                    inputText.value = latestCorrectedText;
                    checkGrammar(); // Re-check to confirm clean state
                    outputArea.style.opacity = '1';
                }, 200);
                fixAllBtn.classList.add('hidden');
            }
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        function resetEditor() {
            inputText.value = '';
            outputArea.innerHTML = '';
            latestCorrectedText = '';
            wordCount.textContent = '0 words';
            statusMsg.textContent = 'Ready';
            fixAllBtn.classList.add('hidden');
            switchToEditMode();
        }

        function switchToEditMode() {
            outputArea.classList.add('hidden');
            inputText.classList.remove('hidden');
            inputText.focus();
            isEditMode = true;
            hideTooltip();
        }

        function updateTextareaFromOutput() {
            inputText.value = outputArea.innerText;
            updateWordCount();
        }

        function copyText() {
            const text = isEditMode ? inputText.value : outputArea.innerText;
            navigator.clipboard.writeText(text);
            
            // Visual feedback
            const originalMsg = statusMsg.textContent;
            statusMsg.textContent = "Copied to clipboard!";
            setTimeout(() => statusMsg.textContent = originalMsg, 2000);
        }

        // Close tooltip on clicking outside
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('dictionary-modal');
            const modalContent = modal.querySelector('.modal-container');
            
            // Close tooltip logic
            if (!tooltip.contains(e.target) && !e.target.classList.contains('error-highlight')) {
                hideTooltip();
            }

            // Close modal if clicked outside
            if (e.target.closest('#dictionary-modal') && !e.target.closest('.modal-container')) {
                toggleModal('dictionary-modal');
            }
        });
    </script>
</body>
</html>
